<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one dark light-table; sections stacked: overview -> shape-by-frame inspector -> merged motion */
:root{
  --bg:#121315; --panel:#1b1d21; --line:#2c2f35; --fg:#e9e6e1; --muted:#9a968f;
  --fire:#ff8a5c; --frost:#69c8fe; --ok:#5fd38a; --bad:#ff6b6b;
  --display:"Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body)}
.wrap{max-width:1240px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
h1{font:700 clamp(30px,5vw,46px)/1.05 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:700 24px/1.2 var(--display);margin:0 0 4px;text-wrap:balance}
h3{font:600 16px/1.3 var(--body);margin:0}
p{margin:0;max-width:68ch;color:var(--muted)}
.lead{color:var(--fg);opacity:.85}
section{display:flex;flex-direction:column;gap:16px}
.eyebrow{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
figure img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#141414}
figcaption{font:13px var(--body);color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:20px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:500 13px var(--mono);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 11px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--frost);outline-offset:2px}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.variant[data-v="fire"][aria-pressed="true"]{background:var(--fire);border-color:var(--fire);color:#1a0f0a}
.variant[data-v="frost"][aria-pressed="true"]{background:var(--frost);border-color:var(--frost);color:#06141c}
.frame-btn{min-width:46px;font-variant-numeric:tabular-nums}
.frame-btn .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:5px;vertical-align:middle;background:transparent}
.frame-btn.has-bad .dot{background:var(--bad)} .frame-btn.all-ok .dot{background:var(--ok)}
.heads{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:0;font:12px var(--mono);color:var(--muted)}
.heads span{padding:0 4px}
.layer{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.layer-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:8px;border:1px solid #0006}
.chips{display:flex;flex-wrap:wrap;gap:6px;font:12px var(--mono);font-variant-numeric:tabular-nums}
.chip{padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.pass{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.chip.fail{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.review{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.review textarea{flex:1 1 260px;min-height:38px;resize:vertical;font:13px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
.rv[data-r="ok"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#06150c}
.rv[data-r="fix"][aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#1c0606}
.legend{display:flex;flex-wrap:wrap;gap:14px;font:12px var(--mono);color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.gifgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:20px}
.note{font:13px var(--body);color:var(--muted)}
#copied{font:12px var(--mono);color:var(--ok)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
<header style="display:flex;flex-direction:column;gap:10px">
  <span class="eyebrow">lib-fx / _core / vector · review</span>
  <h1>__TITLE__</h1>
  <p class="lead">Dựng lại bằng path vector. Xem chuyển động trước, sau đó từng lớp của từng frame: mục tiêu · bản dựng (màu phẳng) · đường pen (neo trắng = trơn, đỏ = góc nhọn).</p>
</header>
<section>
  <div class="bar" role="group" aria-label="Biến thể" id="vbar"></div>
  <div class="bar" role="group" aria-label="Tốc độ">
    <button class="speed" data-s="" aria-pressed="true">tốc độ gốc</button>
    <button class="speed" data-s="_slow" aria-pressed="false">8 fps (chậm)</button>
  </div>
  <figure><img id="gif" alt="gốc | dựng lại"><figcaption>gốc | dựng lại</figcaption></figure>
</section>
<section>
  <div class="bar" id="frames" role="group" aria-label="Frame"></div>
  <figure><div class="heads" style="--n:4"><span>gốc</span><span>lớp mục tiêu</span><span>dựng lại (phẳng)</span><span>dựng lại (hoàn chỉnh)</span></div><img id="frameimg" alt="frame: gốc, mục tiêu, dựng lại"></figure>
  <div class="legend"><span>IoU: xanh khi ≥ 0,70. Phím ← → để chuyển frame.</span></div>
  <div id="layers" style="display:flex;flex-direction:column;gap:16px"></div>
  <div class="bar"><button id="copy">Sao chép nhận xét</button><span id="copied" aria-live="polite"></span></div>
  <textarea id="copybox" hidden readonly style="width:100%;min-height:120px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font:12px var(--mono)"></textarea>
</section>
</div>
<script>
const DATA = __DATA__;
const VS = Object.keys(DATA.variants);
let v = VS[0], f = null, spd = "";
const KEY = "vector-review-" + DATA.name;
let rev = {}; try { rev = JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(rev)) } catch (e) {} };
const frames = () => Object.keys(DATA.variants[v].frames);
const fmt = x => (typeof x === "number" ? x.toFixed(3) : x);
const pass = d => d.iou >= 0.70;
function bar(){ const b = document.getElementById("vbar"); b.innerHTML = "";
  VS.forEach(k => { const e = document.createElement("button"); e.textContent = k; e.setAttribute("aria-pressed", k === v);
    e.onclick = () => { v = k; draw() }; b.appendChild(e) }) }
function draw(){
  bar();
  if (!frames().includes(f)) f = frames()[Math.floor(frames().length / 3)];
  document.getElementById("gif").src = `img/${v}_side${spd}.gif`;
  const fb = document.getElementById("frames"); fb.innerHTML = "";
  frames().forEach(k => { const e = document.createElement("button"); e.className = "frame-btn"; e.textContent = "f" + k;
    e.setAttribute("aria-pressed", k === f); e.onclick = () => { f = k; draw() }; fb.appendChild(e) });
  document.getElementById("frameimg").src = `img/${v}_${f}_frame.png`;
  const box = document.getElementById("layers"); box.innerHTML = "";
  const L = DATA.variants[v].frames[f];
  for (const [l, d] of Object.entries(L)) {
    const key = `${v}/${f}/${l}`, r = rev[key] || {};
    const el = document.createElement("article"); el.className = "layer";
    el.innerHTML = `<div class="layer-top"><h3><span class="sw" style="background:${DATA.variants[v].palette[l]}"></span>${l}</h3>
      <div class="chips"><span class="chip ${pass(d) ? "pass" : "fail"}">IoU ${fmt(d.iou)}</span><span class="chip">${d.anchors} điểm neo</span>
      <span class="chip">${d.kinks} điểm gãy</span><span class="chip">độ cong đổi ${d.curv_var}</span></div></div>
      <div class="heads" style="--n:3"><span>mục tiêu</span><span>dựng lại (phẳng)</span><span>đường pen</span></div>
      <img src="img/${d.img}" alt="${l} frame ${f}" loading="lazy" style="width:100%;height:auto;border-radius:6px;display:block">
      <div class="review"><button class="rv" data-r="ok" aria-pressed="${r.r === "ok"}">Đạt</button>
      <button class="rv" data-r="fix" aria-pressed="${r.r === "fix"}">Cần sửa</button>
      <textarea id="note-${v}-${f}-${l}" placeholder="Ghi chú cho lớp này">${r.n ? r.n.replace(/</g, "&lt;") : ""}</textarea></div>`;
    el.querySelectorAll(".rv").forEach(b => b.onclick = () => { const c = rev[key] || {}; c.r = c.r === b.dataset.r ? null : b.dataset.r; rev[key] = c; save();
      el.querySelectorAll(".rv").forEach(x => x.setAttribute("aria-pressed", x.dataset.r === c.r)) });
    el.querySelector("textarea").oninput = e => { const c = rev[key] || {}; c.n = e.target.value; rev[key] = c; save() };
    box.appendChild(el);
  }
}
document.querySelectorAll(".speed").forEach(b => b.onclick = () => { spd = b.dataset.s;
  document.querySelectorAll(".speed").forEach(x => x.setAttribute("aria-pressed", x === b)); draw() });
document.addEventListener("keydown", e => { if (e.target.tagName === "TEXTAREA") return; const fs = frames(), i = fs.indexOf(f);
  if (e.key === "ArrowRight" && i < fs.length - 1) { f = fs[i + 1]; draw() } if (e.key === "ArrowLeft" && i > 0) { f = fs[i - 1]; draw() } });
document.getElementById("copy").onclick = () => {
  const lines = Object.entries(rev).filter(([k, r]) => r.r || (r.n && r.n.trim())).map(([k, r]) => { const [a, b, c] = k.split("/");
    return `${DATA.name} ${a} f${+b} ${c}: ${r.r === "ok" ? "ĐẠT" : r.r === "fix" ? "CẦN SỬA" : "-"}${r.n && r.n.trim() ? " - " + r.n.trim() : ""}` });
  const txt = lines.length ? lines.join("\n") : "(chưa có nhận xét)", box = document.getElementById("copybox"), msg = document.getElementById("copied");
  box.value = txt; const fb = () => { box.hidden = false; box.select(); msg.textContent = "Không sao chép tự động được: chọn và copy ở ô bên dưới." };
  try { navigator.clipboard.writeText(txt).then(() => { msg.textContent = `Đã sao chép ${lines.length} nhận xét.` }, fb) } catch (e) { fb() } };
draw();
</script>
